# Local development stack:  docker compose up --build
# API  -> http://localhost:8000/docs     Admin -> http://localhost:8000/admin-ui
services:
  db:
    image: postgis/postgis:16-3.4   # PostGIS ready for geo queries; the MVP stores plain lat/lng columns
    environment:
      POSTGRES_USER: sharetaxi
      POSTGRES_PASSWORD: sharetaxi
      POSTGRES_DB: sharetaxi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharetaxi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://sharetaxi:sharetaxi@db:5432/sharetaxi
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend/app:/app/app"]   # live code for development
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
