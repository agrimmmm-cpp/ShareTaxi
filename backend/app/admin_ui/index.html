<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareTaxi Admin</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#12151c; --mute:#667085; --line:#e4e7ec; --brand:#0f9d8a; --bad:#d92d20; --warn:#b54708; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#171b22; --ink:#eef1f6; --mute:#98a2b3; --line:#2a303a; } }
  * { box-sizing:border-box } body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink) }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0 }
  header b { font-size:16px; color:var(--brand) } nav { display:flex; gap:4px; flex-wrap:wrap; flex:1 }
  nav button { background:none; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--mute); font:inherit }
  nav button.on { background:var(--brand); color:#fff }
  main { padding:24px; max-width:1200px; margin:auto } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px } .card h4 { margin:0 0 6px; color:var(--mute); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em }
  .card .v { font-size:26px; font-weight:700 } table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top } th { color:var(--mute); font-weight:500; font-size:12px }
  .pill { padding:2px 8px; border-radius:99px; background:var(--line); font-size:12px } .pill.ok { background:#d1fadf; color:#05603a } .pill.bad { background:#fee4e2; color:var(--bad) }
  button.act { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:4px 10px; border-radius:8px; cursor:pointer; margin-right:4px }
  button.pri { background:var(--brand); color:#fff; border:0; padding:10px 16px; border-radius:10px; cursor:pointer; font:inherit }
  input { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; width:100% }
  #login { max-width:340px; margin:12vh auto; display:grid; gap:10px } .row { display:flex; gap:8px; align-items:center } .mt { margin-top:16px } .err { color:var(--bad) }
</style>
</head>
<body>
<div id="login">
  <h2 style="color:var(--brand);margin:0">ShareTaxi Admin</h2>
  <input id="email" placeholder="Email" value="admin@sharetaxi.dev" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="pri" onclick="login()">Sign in</button><div id="lerr" class="err"></div>
</div>
<div id="app" hidden>
  <header><b>ShareTaxi</b><nav id="nav"></nav><button class="act" onclick="logout()">Sign out</button></header>
  <main id="main"></main>
</div>
<script>
const API = location.origin; let token = sessionStorage.getItem('tok');
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers||{}) } });
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('auth'); }
  if (!r.ok) { alert((await r.json()).detail || r.statusText); throw new Error(r.statusText); }
  return r.status === 204 ? null : r.json();
}
async function login() {
  const r = await fetch(API + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: $('#email').value, password: $('#pw').value }) });
  if (!r.ok) { $('#lerr').textContent = 'Sign-in failed'; return; }
  token = (await r.json()).access_token;
  try { await api('/admin/analytics'); } catch { $('#lerr').textContent = 'This account is not an admin'; return; }
  sessionStorage.setItem('tok', token); start();
}
function logout() { sessionStorage.removeItem('tok'); token = null; $('#app').hidden = true; $('#login').hidden = false; }
const pill = (s) => `<span class="pill ${['approved','captured','completed','paid','resolved','confirmed'].includes(s)?'ok':['rejected','failed','cancelled','open','suspended'].includes(s)?'bad':''}">${esc(s)}</span>`;
const table = (cols, rows) => `<table><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</table>`;
const money = (n) => '$' + Number(n).toFixed(2);
const views = {
  async Analytics() {
    const a = await api('/admin/analytics');
    const k = [['Total bookings',a.total_bookings],['Active users (30d)',a.active_users_30d],['Passenger match rate',(a.passenger_match_rate*100).toFixed(0)+'%'],['Avg occupancy',a.average_occupancy],['Avg savings',a.average_savings_percent+'%'],['Driver earnings',money(a.driver_earnings)],['Platform revenue',money(a.platform_revenue)],['Cancellation rate',(a.cancellation_rate*100).toFixed(1)+'%']];
    return `<div class="grid">${k.map(([t,v])=>`<div class="card"><h4>${t}</h4><div class="v">${esc(v)}</div></div>`).join('')}</div>
      <h3 class="mt">Most popular routes</h3>${table([['Route',r=>esc(r.origin)+' → '+esc(r.destination)],['Requests',r=>r.requests]], a.popular_routes)}`;
  },
  async Users() { const u = await api('/admin/users'); return table([['ID',r=>r.id],['Name',r=>esc(r.name)],['Email',r=>esc(r.email)],['Roles',r=>esc(r.roles.join(', '))],['Rating',r=>r.rating||'–'],['',r=>`<button class="act" onclick="act('/admin/users/${r.id}/${r.suspended?'unsuspend':'suspend'}')">${r.suspended?'Unsuspend':'Suspend'}</button>`]], u); },
  async Verification() { const d = await api('/admin/drivers'); return table([['Driver',r=>esc(r.name)],['Status',r=>pill(r.status)],['Documents',r=>r.documents.map(x=>`<div>${esc(x.type)} ${pill(x.status)} <button class="act" onclick="act('/admin/documents/${x.id}/review?approve=true')">Approve</button><button class="act" onclick="act('/admin/documents/${x.id}/review?approve=false')">Reject</button></div>`).join('')||'–'],['Cancel rate',r=>(r.cancellation_rate*100).toFixed(0)+'%']], d); },
  async Rides() { const r = await api('/admin/rides'); return table([['Ride',x=>x.id],['Status',x=>pill(x.status)],['Departure',x=>esc(x.departure)],['Pax',x=>x.passengers],['Fare',x=>money(x.total_fare)],['Platform fee',x=>money(x.platform_fee)],['Driver payout',x=>money(x.driver_payout)]], r); },
  async Matching() { const [m, rq] = await Promise.all([api('/admin/matches'), api('/admin/requests')]); return `<button class="pri" onclick="act('/admin/rematch')">Re-run matching</button><h3>Matches</h3>${table([['ID',x=>x.id],['Status',x=>pill(x.status)],['Source',x=>x.source],['Score',x=>x.score],['Fare',x=>money(x.total_fare)],['Driver net',x=>money(x.driver_net)]], m)}<h3>Passenger requests</h3>${table([['ID',x=>x.id],['Route',x=>esc(x.from)+' → '+esc(x.to)],['Status',x=>pill(x.status)],['Departure',x=>esc(x.departure)],['Group',x=>x.group_id||'–']], rq)}`; },
  async Payments() { const p = await api('/admin/payments'); return table([['ID',x=>x.id],['Ride',x=>x.ride_id],['Amount',x=>money(x.amount)],['Fee',x=>money(x.fee)],['Status',x=>pill(x.status)],['Refunded',x=>money(x.refunded)],['',x=>x.status==='captured'?`<button class="act" onclick="act('/admin/payments/${x.id}/refund',{amount_cents:null})">Refund</button>`:'']], p); },
  async Safety() { const r = await api('/admin/reports'); return table([['ID',x=>x.id],['Type',x=>x.sos?'<b class="err">SOS</b>':esc(x.category)],['Status',x=>pill(x.status)],['Ride',x=>x.ride_id||'–'],['Details',x=>esc(x.details)],['',x=>`<button class="act" onclick="resolve(${x.id},'resolved')">Resolve</button><button class="act" onclick="resolve(${x.id},'dismissed')">Dismiss</button>`]], r); },
  async Settings() { const s = await api('/admin/settings'); return `<div class="card" style="max-width:420px"><h4>Platform commission</h4><div class="row"><input id="fee" type="number" step="0.01" min="0" max="0.5" value="${s.platform_commission_rate}"><button class="pri" onclick="saveFee()">Save</button></div><p style="color:var(--mute)">Share of each fare kept by ShareTaxi (0–0.5). Applies to new matches.</p></div>
    <h3 class="mt">Matching limits</h3><pre class="card">${esc(JSON.stringify(s.matching, null, 2))}</pre>`; },
};
async function act(path, body) { await api(path, { method:'POST', body: body ? JSON.stringify(body) : undefined }); show(current); }
async function resolve(id, status) { await api(`/admin/reports/${id}/resolve`, { method:'POST', body: JSON.stringify({ status }) }); show(current); }
async function saveFee() { await api('/admin/settings/fees', { method:'PUT', body: JSON.stringify({ platform_commission_rate: parseFloat($('#fee').value) }) }); show('Settings'); }
let current = 'Analytics';
async function show(name) { current = name; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.textContent === name)); $('#main').innerHTML = await views[name](); }
function start() { $('#login').hidden = true; $('#app').hidden = false; $('#nav').innerHTML = Object.keys(views).map(n => `<button onclick="show('${n}')">${n}</button>`).join(''); show(current); }
if (token) api('/admin/analytics').then(start).catch(() => {});
</script>
</body>
</html>
