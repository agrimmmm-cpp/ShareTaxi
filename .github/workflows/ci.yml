name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: sharetaxi, POSTGRES_PASSWORD: sharetaxi, POSTGRES_DB: sharetaxi }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sharetaxi" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Unit + API tests
        run: pytest -q
      - name: Migrations apply cleanly on Postgres
        env: { DATABASE_URL: "postgresql+psycopg://sharetaxi:sharetaxi@localhost:5432/sharetaxi" }
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, tags: sharetaxi-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
